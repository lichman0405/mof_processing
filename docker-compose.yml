version: '3.8'

services:
  # 后端API服务
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: mof-backend
    volumes:
      # 持久化存储
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - FILE_RETENTION_HOURS=24
    restart: unless-stopped
    networks:
      - mof-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mof-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mof-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  mof-network:
    driver: bridge
